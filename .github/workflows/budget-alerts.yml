name: Licits - Enviar alertas orcamentarios
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar fila de alertas ao fiscal
        env:
          DISPATCH_URL: ${{ secrets.LICITS_DISPATCH_URL }}
          DISPATCH_TOKEN: ${{ secrets.LICITS_ALERT_DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_URL}" || -z "${DISPATCH_TOKEN}" ]]; then
            echo "::error::Faltam LICITS_DISPATCH_URL e LICITS_ALERT_DISPATCH_SECRET; nenhum alerta foi enviado."
            exit 1
          fi
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 90 --retry 2 \
            --header "x-alert-token: ${DISPATCH_TOKEN}" \
            --request POST "${DISPATCH_URL}")
          printf '%s' "$RESPONSE" | python3 -c '
          import json,sys
          try:
              result=json.load(sys.stdin)
              failed=int(result.get("failed",0))
              print("Alertas processados:",int(result.get("processed",0)))
              print("Solicitações de envio aceitas:",int(result.get("sent",0)))
              print("Falhas:",failed)
              if failed: sys.exit(1)
          except (ValueError,TypeError,KeyError) as exc:
              sys.exit("Resposta invalida do worker de e-mail: "+str(exc))
          '
