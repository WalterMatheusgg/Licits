name: Aplicar migração React -> Supabase

on:
  push:
    branches: [feat/supabase-core-migration]
    paths:
      - '.github/workflows/apply-supabase-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-core-migration
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Migrar integrações legadas com alterações conservadoras
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for path in list(Path('src').rglob('*.jsx')) + list(Path('src').rglob('*.js')):
              if path.name == 'base44Client.js':
                  continue
              original = path.read_text()
              text = original.replace("import { base44 } from '@/api/base44Client';", "import { dataClient } from '@/api/dataClient';")
              text = text.replace('base44.', 'dataClient.')
              if text != original:
                  path.write_text(text)
          items = Path('src/components/contracts/ContractItemsTab.jsx')
          text = items.read_text()
          before = '      await dataClient.entities.ContractItem.update(item.id, { used_qty: (item.used_qty || 0) + qty });\n'
          assert before in text, 'consume flow has changed; review before removing double write'
          text = text.replace(before, '      // A função SQL register_item_withdrawal atualiza o saldo e grava a baixa em uma transação.\n')
          items.write_text(text)
          doc = Path('src/components/contracts/DocumentUpload.jsx')
          text = doc.read_text().replace('doc_type: docType,', 'document_type: docType,')
          doc.write_text(text)
          users = Path('src/pages/Users.jsx')
          text = users.read_text()
          before = "    const role = inviteRole === 'admin' ? 'admin' : 'user';"
          assert before in text
          text = text.replace(before, "    const role = inviteRole;")
          users.write_text(text)
          audit = Path('src/lib/audit.js')
          audit.write_text("""// Auditoria é feita por triggers SQL no Supabase, na mesma transação que os dados.
          // Não há escrita direta de logs no browser: evita eventos falsificados ou divergências.
          export async function logAudit() { return undefined; }
          """)
          for file in ['src/pages/AIAssistant.jsx','src/pages/AlertsEmail.jsx']:
              path=Path(file)
              path.write_text(path.read_text().replace('ContratoIA','Licits'))
          Path('src/api/base44Client.js').unlink()
          Path('src/lib/app-params.js').unlink()
          vite=Path('vite.config.js')
          vite.write_text("""import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import { fileURLToPath } from 'node:url';
          export default defineConfig({
            plugins: [react()],
            resolve: { alias: { '@': fileURLToPath(new URL('./src', import.meta.url)) } },
          });
          """)
          package=Path('package.json')
          value=json.loads(package.read_text())
          value['name']='licits-contract-management'
          value['version']='1.0.0'
          for dependency in ['@base44/sdk','@base44/vite-plugin']:
              value['dependencies'].pop(dependency,None)
              value['devDependencies'].pop(dependency,None)
          package.write_text(json.dumps(value,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Atualizar lockfile e instalar
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Typecheck, lint e build
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Confirmar remoção de SDK legado
        run: |
          if grep -R --include='*.js' --include='*.jsx' '@base44/sdk\|base44Client\|dataClient\\.auth\\.logout' src; then
            echo 'Dependência antiga ainda encontrada' >&2
            exit 1
          fi
      - name: Publicar migração validada na branch
        run: |
          git rm -f -- .github/workflows/apply-supabase-migration.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: migrate business frontend to Supabase and remove Base44"
          git push origin HEAD:feat/supabase-core-migration
