name: Remover branch temporaria integrada

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-temporary-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Excluir somente a branch temporaria ja integrada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/1" --jq '.merged' | grep -qx 'true'; then
            echo 'PR integrado. Eliminando a branch temporaria.'
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/supabase-core-migration"
          else
            echo 'A PR ainda nao foi integrada. Abortando.'
            exit 1
          fi
