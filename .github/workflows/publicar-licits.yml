name: Publicar código-fonte do Licits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-licits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar e extrair Licits.zip com segurança
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          import stat, shutil, sys
          archive = Path("Licits.zip")
          if not archive.is_file():
              print("ZIP não existe; o código talvez já esteja publicado.")
              sys.exit(0)
          with ZipFile(archive) as z:
              if z.testzip() is not None:
                  raise ValueError("ZIP está corrompido")
              files = [i for i in z.infolist() if not i.is_dir()]
              if not files or len(files) > 500:
                  raise ValueError("Número inesperado de arquivos")
              if sum(i.file_size for i in files) > 30_000_000:
                  raise ValueError("ZIP expandido grande demais")
              if "Licits/package.json" not in {i.filename for i in files}:
                  raise ValueError("package.json esperado não encontrado")
              for item in files:
                  parts = PurePosixPath(item.filename).parts
                  if not parts or parts[0] != "Licits" or len(parts) < 2:
                      raise ValueError(f"Caminho inesperado: {item.filename}")
                  rel = Path(*parts[1:])
                  if any(p in {".git", "node_modules", "dist", "build", "__pycache__"} for p in rel.parts):
                      raise ValueError(f"Arquivo de build/privado detectado: {rel}")
                  if any(p.lower() in {".env", ".env.local", ".env.production", "id_rsa"} for p in rel.parts):
                      raise ValueError(f"Arquivo privado detectado: {rel}")
                  if (item.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise ValueError(f"Link simbólico inesperado: {rel}")
                  if not rel.parts:
                      continue
                  target = Path.cwd() / rel
                  if target.exists() and rel.as_posix() != "README.md":
                      raise FileExistsError(f"Não sobrescrever existente: {rel}")
                  if rel.as_posix() == "README.md":
                      target = Path.cwd() / "docs" / "README-ORIGINAL-DO-ZIP.md"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(item) as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)
          print(f"Extraídos {len(files)} arquivos do código original.")
          PY
      - name: Publicar os arquivos na raiz do repositório
        shell: bash
        run: |
          if [ -f Licits.zip ] && [ -f package.json ]; then
            git rm -- Licits.zip
            git add -A
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git diff --cached --stat
            git commit -m "Publish Licits source code from existing archive"
            git push origin HEAD:main
          else
            echo "Nenhuma extração necessária."
          fi
