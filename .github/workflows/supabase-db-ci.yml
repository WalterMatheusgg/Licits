name: CI • Supabase SQL

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'
      - 'src/api/**'
      - 'src/components/contracts/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-db-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'
      - 'src/api/**'
      - 'src/components/contracts/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-db-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OPENAI_API_KEY: placeholder-for-local-supabase-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local Supabase CLI
        run: npx --yes supabase@latest --version
      - name: Start isolated local Supabase and apply migrations
        run: npx --yes supabase@latest start
      - name: Recreate local database from all migrations
        run: npx --yes supabase@latest db reset
      - name: Verify schema and row-level security
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          RLS_COUNT=$(psql "$DB" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_tables where schemaname='public' and rowsecurity=true;")
          ARP_COUNT=$(psql "$DB" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='contract_items' and column_name='price_registration_group_id';")
          READ_COUNT=$(psql "$DB" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='notification_reads';")
          echo "RLS tables: $RLS_COUNT | ARP column: $ARP_COUNT | Read receipts: $READ_COUNT"
          test "$RLS_COUNT" -ge 19
          test "$ARP_COUNT" -eq 1
          test "$READ_COUNT" -eq 1
      - name: Check safe audit triggers without writing data
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f scripts/verify-audit-readonly.sql
      - name: Verify atomic administrative resolution RPC
        run: |
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='resolve_admin_request';" | grep -qx 1
          psql "$DB" -v ON_ERROR_STOP=1 -Atc "select has_function_privilege('anon','public.resolve_admin_request(uuid,public.admin_request_status,text)','EXECUTE');" | grep -qx f
      - name: Test real tenant isolation and atomic inventory in PostgreSQL
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/tenant_isolation_integration.sql
      - name: Test invitation acceptance and integration quotas
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/invitations_quotas_integration.sql
      - name: Test member removal keeps history and permits reinviting
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/organization_membership_removal_integration.sql
      - name: Test fiscal purchase limits and budget alerts
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/budget_alerts_integration.sql
      - name: Test concurrent item withdrawals
        run: bash supabase/tests/concurrent_item_withdrawal.sh
      - name: Test contract expiry alert deduplication and worker claims
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/contract_expiry_alerts_integration.sql
      - name: Test atomic API contract creation
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/integration_contract_create.sql
      - name: Test atomic document import and rollback
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/atomic_document_import_integration.sql
      - name: Test audit de-duplication and redaction
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/audit_deduplication_integration.sql
      - name: Validate backup with matching PostgreSQL 17 client
        run: |
          bash -n scripts/backup-database.sh
          DB_CONTAINER=$(docker ps --filter "name=supabase_db_" --format '{{.Names}}' | head -n 1)
          test -n "$DB_CONTAINER"
          docker exec -u postgres "$DB_CONTAINER" pg_dump \
            --format=custom --no-owner --no-privileges \
            --file=/tmp/licits-ci-backup.dump --dbname=postgres
          docker exec -u postgres "$DB_CONTAINER" pg_restore \
            --list /tmp/licits-ci-backup.dump > /tmp/licits-inventory.txt
          grep -q "TABLE DATA.*organizations" /tmp/licits-inventory.txt
          grep -q "TABLE DATA.*contracts" /tmp/licits-inventory.txt
          docker exec "$DB_CONTAINER" rm -f /tmp/licits-ci-backup.dump
          rm -f /tmp/licits-inventory.txt
      - name: Show state on failure
        if: failure()
        run: npx --yes supabase@latest status || true
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@latest stop || true
