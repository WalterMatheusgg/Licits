name: CI • Edge Functions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge Functions
        run: |
          deno check supabase/functions/invite-member/index.ts
          deno check supabase/functions/send-email/index.ts
          deno check supabase/functions/analyze-contract/index.ts
          deno check supabase/functions/extract-document/index.ts
