name: CI • Licits

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React / Vite • qualidade e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund
      - name: Testar respostas fiscais locais
        run: node --test tests/*.test.js
      - name: Verificar tipos
        run: npm run typecheck
      - name: Analisar código
        run: npm run lint
      - name: Compilar aplicação
        run: npm run build
      - name: Verificar script de recuperacao de acesso
        run: bash -n scripts/restaurar-acesso.sh
